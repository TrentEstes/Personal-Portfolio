<title>Trent Estes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Trent Estes, brand and packaging designer.">
<style>
@font-face{font-family:"Zilla Slab";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/zilla-slab-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Zilla Slab";font-weight:500;font-style:italic;font-display:swap;src:url(fonts/zilla-slab-latin-500-italic.woff2) format("woff2")}
@font-face{font-family:"Zilla Slab";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/zilla-slab-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Zilla Slab";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/zilla-slab-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
/* Neutral studio look: light grey ground, white cards, black type, hairline guides, small grey mono labels. */
:root{
  --bg:#F2F2F1;
  --surface:#E8E8E6;
  --card:#FFFFFF;
  --fg:#0E0E0E;
  --muted:#8A8A86;
  --line:#DCDCD9;
  --sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --slab:"Zilla Slab","Rockwell","Roboto Slab",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:800px){.pad{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.mono{font:400 11.5px/1.35 var(--mono);letter-spacing:.01em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:999px;font:500 14px/1 var(--sans);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.btn.ink{background:var(--fg);color:#fff}
.btn.ink:hover{background:#3a3a3a}
.btn.line{border:1px solid var(--line);background:var(--card)}
.btn.line:hover{border-color:var(--fg)}
.btn .ar{transition:transform .25s}
.btn:hover .ar{transform:translateX(3px)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:58px}
.mark{font:600 17px/1 var(--slab);letter-spacing:-.015em;text-decoration:none}
.status{display:none;align-items:center;gap:8px;color:var(--muted)}
@media (min-width:980px){.status{display:inline-flex}}
.dot{width:6px;height:6px;border-radius:50%;background:#33A853;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(51,168,83,.45)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.tnav{display:flex;align-items:center;gap:clamp(12px,2vw,24px)}
.tnav a{text-decoration:none;font:400 14px/1 var(--sans);color:#555}
.tnav a:hover{color:var(--fg)}
.tnav .cta{background:var(--fg);color:#fff;padding:10px 14px;border-radius:999px}
.tnav .cta:hover{background:#3a3a3a;color:#fff}
@media (max-width:640px){.tnav .hide-s{display:none}.tnav{gap:14px}.tnav .cta{padding:9px 12px}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;min-height:max(600px,calc(100svh - 59px));isolation:isolate}
.g{position:absolute;background:var(--line);z-index:0}
.g.v{top:0;bottom:0;width:1px}.g.h{left:0;right:0;height:1px}
.h-frame{position:absolute;z-index:2;left:50%;top:52%;width:min(44vw,660px);aspect-ratio:823/568;transform:translate(-50%,-50%)}
.h-frame .lbl{position:absolute;top:-22px;left:0;color:var(--muted)}
.h-frame .lbl.r{left:auto;right:0}
.h-me{width:100%;height:auto;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both .1s}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.h-word{position:absolute;z-index:1;margin:0;font:700 clamp(64px,10.5vw,180px)/.85 var(--slab);letter-spacing:-.015em;white-space:nowrap;animation:fade 1s ease both}
.h-word.a{left:clamp(16px,2.2vw,32px);top:22%}
.h-word.b{right:clamp(16px,2.2vw,32px);top:48%;animation-delay:.1s}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.h-me,.h-word{animation:none}}
.h-top,.h-bot{position:absolute;z-index:3;left:0;right:0;display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
.h-top{top:18px;align-items:flex-start;color:var(--muted)}
.h-bot{bottom:clamp(20px,4vh,40px)}
.h-bot p{margin:0;max-width:min(360px,30vw);font:400 clamp(16px,1.3vw,19px)/1.4 var(--sans);letter-spacing:-.01em}
.h-btns{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){
  .hero{min-height:calc(100svh - 59px)}
  .h-word{font-size:27vw}
  .h-word.a{top:52px}.h-word.b{top:calc(52px + 23vw);right:16px}
  .h-frame{width:88vw;top:auto;bottom:9svh;transform:translateX(-50%)}
  .h-bot{display:none}
  .g.hide-m{display:none}
}
.m-intro{display:none}
@media (max-width:760px){.m-intro{display:flex;flex-direction:column;gap:18px;padding-block:24px 30px;border-top:1px solid var(--line)}.m-intro p{margin:0;font-size:18px;line-height:1.4}}

/* ---------- section heads ---------- */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:clamp(72px,10vw,140px) clamp(20px,2.4vw,30px);border-bottom:1px solid var(--line)}
.sh h2{margin:0;font:600 clamp(44px,6vw,96px)/.9 var(--slab);letter-spacing:-.015em}
.sh .mono{color:var(--muted);padding-bottom:6px}

/* ---------- selected work ---------- */
.plates{display:grid;grid-template-columns:1fr;gap:clamp(44px,5vw,64px) clamp(20px,2.4vw,36px);padding-block:clamp(36px,4vw,56px) clamp(24px,3vw,40px)}
@media (min-width:640px){.plates{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.plates{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plate{display:flex;flex-direction:column;gap:14px;text-decoration:none;min-width:0}
.pl-img{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--surface);border-radius:6px}
.pl-img img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.pl-img.white{background:#fff}.pl-img.white img{object-fit:contain}
.plate:hover .pl-img img{transform:scale(1.03)}
.pl-num{display:flex;justify-content:space-between;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.pl-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pl-t{margin:0;font:600 clamp(22px,1.8vw,27px)/1.1 var(--slab);letter-spacing:-.01em}
.pl-row .ar{flex:none;transition:transform .25s}
.plate:hover .pl-row .ar{transform:translateX(4px)}
.pl-k{margin:-6px 0 0;font-size:14.5px;color:#666;max-width:36ch}
@media (prefers-reduced-motion: reduce){.pl-img img{transition:none}}

/* ---------- poster hall entry ---------- */
.hentry{display:block;position:relative;background:var(--card);text-decoration:none;overflow:hidden;border-block:1px solid var(--line);margin-top:clamp(40px,6vw,80px)}
.he-in{display:grid;grid-template-columns:1fr;gap:10px;padding-block:clamp(48px,6vw,80px)}
@media (min-width:980px){.he-in{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center}}
.he-text{position:relative;z-index:2;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.he-text .mono{color:var(--muted)}
.he-text h2{margin:0;font:600 clamp(52px,7vw,112px)/.88 var(--slab);letter-spacing:-.015em}
.he-text p{margin:0;max-width:32ch;font-size:17px;color:#555}
.he-stage{position:relative;height:clamp(320px,34vw,460px);perspective:1400px;display:grid;place-items:center}
.he-stage::after{content:"";position:absolute;left:20%;right:20%;bottom:6%;height:40px;background:radial-gradient(closest-side,rgba(0,0,0,.14),transparent);filter:blur(4px)}
.ring{--rr:clamp(170px,19vw,270px);position:relative;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-10deg)}
.ring .sp{position:absolute;transform-style:preserve-3d;animation:spin 46s linear infinite}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(-360deg)}}
@media (prefers-reduced-motion: reduce){.ring .sp{animation:none}}
.ring figure{position:absolute;margin:0;height:clamp(96px,10vw,140px);backface-visibility:hidden;box-shadow:0 14px 20px -14px rgba(0,0,0,.45);background:#ddd}
.ring img{height:100%;width:auto;max-width:none}
.he-stage .gl{position:absolute;background:var(--line)}
@media (max-width:979px){.he-stage{height:300px}}

/* ---------- more work ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:14px 10px 12px;border-bottom:1px solid var(--line);font-weight:400;color:var(--muted)}
.tbl td{padding:18px 10px;border-bottom:1px solid var(--line);vertical-align:baseline}
.tbl td.t{font:600 clamp(22px,2vw,28px)/1.05 var(--slab);letter-spacing:-.015em}
.tbl td.t a{text-decoration:none}
.tbl tbody tr{cursor:pointer;transition:background .2s}
.tbl tbody tr:hover{background:var(--card)}
.tbl .y{width:9%;color:var(--muted)}
.tbl .go{text-align:right;width:40px}
@media (max-width:640px){.tbl .hide{display:none}}
.peek{position:fixed;left:0;top:0;width:220px;aspect-ratio:4/3;pointer-events:none;z-index:25;overflow:hidden;background:var(--surface);opacity:0;border-radius:4px;transform:translate(18px,-50%) scale(.96);transition:opacity .15s,transform .15s;box-shadow:0 18px 30px -16px rgba(0,0,0,.4)}
.peek.on{opacity:1;transform:translate(18px,-50%) scale(1)}
.peek img{width:100%;height:100%;object-fit:cover}
@media (hover:none){.peek{display:none}}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:1fr;gap:28px;padding-block:clamp(28px,3vw,40px) clamp(72px,10vw,140px)}
@media (min-width:900px){.about{grid-template-columns:minmax(0,4fr) minmax(0,8fr);column-gap:clamp(16px,2vw,32px);align-items:start}}
.a-photo{margin:0;max-width:400px}
.a-photo img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 12%;border-radius:4px}
.a-photo figcaption{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted)}
.a-body p{margin:0 0 1em;font:400 clamp(21px,2vw,30px)/1.3 var(--sans);letter-spacing:-.025em;max-width:30em}
.a-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px}
.a-tags span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px}

/* ---------- contact ---------- */
.foot{background:#0E0E0E;color:#EDEDEB}
.f-in{display:grid;grid-template-columns:1fr;gap:34px;padding-block:clamp(72px,10vw,140px) 40px}
@media (min-width:900px){.f-in{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:end}}
.foot h2{margin:0;font:600 clamp(48px,7vw,120px)/.9 var(--slab);letter-spacing:-.015em}
.foot h2 span{color:#7A7A76}
.foot ul{list-style:none;margin:0;padding:0;display:grid}
.foot li a{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #2A2A28;text-decoration:none;font-size:13px}
.foot li a:hover{color:#fff}
.foot li a span:first-child{color:#7A7A76}
.legal{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-block:18px 26px;border-top:1px solid #2A2A28;color:#6A6A66}

/* ---------- floating card ---------- */
.fcard{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:26;width:232px;background:var(--card);padding:14px 16px;border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 30px -18px rgba(0,0,0,.35);transition:opacity .35s,transform .35s}
.fcard.away{opacity:0;pointer-events:none;transform:translateY(20px)}
.fcard b{display:block;font:600 18px/1.1 var(--slab);letter-spacing:-.015em}
.fcard span{display:block;margin-top:4px;color:var(--muted)}
.fcard .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.fcard .go{display:inline-flex;align-items:center;gap:6px;background:var(--fg);color:#fff;border-radius:999px;padding:8px 13px;font:500 13px/1 var(--sans);text-decoration:none}
.fcard .x{position:absolute;top:6px;right:9px;font-size:16px;line-height:1;padding:4px;color:var(--muted)}
@media (max-width:640px){.fcard{width:auto;padding:9px 34px 10px 12px}.fcard span,.fcard .row a+a{display:none}.fcard b{font-size:16px}.fcard .row{margin-top:8px}}

/* ---------- project page ---------- */
.p-head{padding-block:clamp(28px,4vw,52px) clamp(28px,4vw,48px)}
.p-head .back{text-decoration:none;color:var(--muted)}.p-head .back:hover{color:var(--fg)}
.p-head h1{margin:22px 0 0;font:600 clamp(52px,8vw,136px)/.9 var(--slab);letter-spacing:-.015em;text-wrap:balance}
.p-sub{display:grid;grid-template-columns:1fr;gap:24px;margin-top:clamp(24px,3vw,40px);padding-top:18px;border-top:1px solid var(--line)}
@media (min-width:900px){.p-sub{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}}
.p-info{margin:0;font:400 clamp(19px,1.6vw,23px)/1.4 var(--sans);letter-spacing:-.015em;max-width:36ch}
.p-meta{margin:0;display:grid;align-content:start;border-top:1px solid var(--line)}
.p-meta div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.p-meta dt{color:var(--muted)}.p-meta dd{margin:0;text-align:right}
.p-body{display:flex;flex-direction:column;gap:clamp(8px,1.2vw,14px);padding-bottom:clamp(64px,8vw,120px)}
.p-row{display:grid;gap:clamp(8px,1.2vw,14px);grid-template-columns:1fr;align-items:start}
@media (min-width:700px){.p-row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.p-row.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.p-row figure{margin:0;overflow:hidden;background:var(--surface);border-radius:4px}
.p-row img{width:100%;height:auto}
.p-row.c1 img{max-height:92vh;object-fit:contain}
.p-h{display:flex;align-items:baseline;gap:16px;margin:clamp(48px,6vw,88px) 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.p-h .mono{color:var(--muted)}
.p-h b{font:600 clamp(28px,2.8vw,42px)/1 var(--slab);letter-spacing:-.015em}
.p-text{margin:6px 0 clamp(18px,2.5vw,32px);max-width:52ch;font-size:18px;line-height:1.5}
.p-cap{margin:2px 0 clamp(14px,2vw,24px);color:var(--muted)}
.p-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 24px;margin:4px 0 clamp(20px,3vw,36px);border-top:1px solid var(--line)}
.p-facts div{padding:14px 0;border-bottom:1px solid var(--line)}
.p-facts dt{font:400 11.5px/1.3 var(--mono);color:var(--muted);margin-bottom:4px}
.p-facts dd{margin:0;font-size:16px}
.p-list{list-style:none;margin:0 0 clamp(20px,3vw,36px);padding:0;max-width:62ch;border-top:1px solid var(--line);counter-reset:li}
.p-list li{display:grid;grid-template-columns:3em 1fr;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px;counter-increment:li}
.p-list li::before{content:counter(li,decimal-leading-zero);font:400 12px/1.9 var(--mono);color:var(--muted)}
.vid{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:16px 18px;text-decoration:none}
.vid:hover{border-color:var(--fg)}
.nextp{display:grid;grid-template-columns:1fr;gap:16px;padding-block:22px clamp(80px,10vw,120px);border-top:1px solid var(--line);text-decoration:none}
@media (min-width:760px){.nextp{grid-template-columns:minmax(0,1fr) 320px;align-items:end}}
.nextp .mono{color:var(--muted)}
.nextp .t{display:block;margin-top:10px;font:600 clamp(40px,6vw,96px)/.92 var(--slab);letter-spacing:-.015em;transition:transform .35s}
.nextp:hover .t{transform:translateX(8px)}
.nextp .pl-img{aspect-ratio:4/3}

/* ---------- the poster hall: a spiral you turn through ---------- */
body.in-hall{overflow:hidden}
body.in-hall .top,body.in-hall .fcard{display:none}
.hall{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse 80% 70% at 50% 45%,#FAFAF9,#ECECEA 70%,#E4E4E2);color:var(--fg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.hall.drag{cursor:grabbing}
.hall .g{z-index:0}
.stage{position:absolute;inset:0;perspective:1700px;perspective-origin:50% 42%}
.cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.helix{position:absolute;width:0;height:0;transform-style:preserve-3d}
.hc{position:absolute;left:0;top:0;transform-style:preserve-3d;cursor:pointer}
.hc .fa,.hc .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.hc .fa{background:#ddd;box-shadow:0 1px 0 rgba(0,0,0,.06),0 36px 40px -30px rgba(0,0,0,.5)}
.hc .fa img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.hc .fa i{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.hc .bk{transform:rotateY(180deg);background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);display:flex;align-items:flex-end;padding:10px;color:#B5B5B1}
.hc .t1,.hc .t2{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:8px;color:var(--muted);backface-visibility:hidden;-webkit-backface-visibility:hidden;white-space:nowrap;font:400 10.5px/1 var(--mono)}
.hc .t1{bottom:100%;margin-bottom:7px}
.hc .t2{top:100%;margin-top:8px}
.hc .t2 b{font-weight:400;color:#444;overflow:hidden;text-overflow:ellipsis}
.hc.cur .t2 b{color:var(--fg)}
.floor{position:absolute;left:-600px;width:1200px;height:1200px;top:0;margin-top:-600px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.16),rgba(0,0,0,.05) 45%,transparent 70%)}
.hud{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 14px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .back{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;text-decoration:none}
.hud .back:hover{border-color:var(--fg)}
.hud h1{margin:0;font:600 17px/1 var(--slab);letter-spacing:-.015em;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.hud .cnt{color:var(--muted);min-width:70px;text-align:right}
.now{position:absolute;z-index:3;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;max-width:60vw;pointer-events:none}
.now b{font:600 clamp(28px,3vw,44px)/1 var(--slab);letter-spacing:-.015em}
.now span{color:var(--muted)}
.hint{position:absolute;z-index:3;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));color:var(--muted);text-align:right;transition:opacity .6s;pointer-events:none;max-width:40vw}
.hint.gone{opacity:0}
.hnav{display:flex;gap:6px;position:absolute;z-index:3;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.hnav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.75);display:grid;place-items:center}
.hnav button:hover{border-color:var(--fg)}
@media (max-width:640px){.hud h1{display:none}.hnav{display:none}.hint{max-width:none;left:16px;right:16px;text-align:left;bottom:auto;top:calc(68px + env(safe-area-inset-top,0px))}}
.lb{position:absolute;inset:0;z-index:5;background:rgba(242,242,241,.97);display:grid;grid-template-columns:1fr;place-items:center;padding:70px 16px 24px;cursor:default;animation:fade .3s both}
@media (min-width:900px){.lb{grid-template-columns:minmax(0,1fr) 320px;gap:40px;padding:40px 60px}}
.lb img{max-height:calc(100svh - 170px);max-width:100%;width:auto;box-shadow:0 30px 50px -30px rgba(0,0,0,.45)}
@media (min-width:900px){.lb img{max-height:calc(100svh - 80px);justify-self:end}}
.lb .meta{display:flex;flex-direction:column;gap:10px;justify-self:start;width:100%;max-width:420px}
.lb .meta b{font:600 44px/.95 var(--slab);letter-spacing:-.015em}
.lb .meta .mono{color:var(--muted)}
.lb .meta a.more{color:var(--fg)}
.lb .x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;height:38px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:999px}
.lb .x:hover{border-color:var(--fg)}
</style>

<script>
/* ============================================================
   EDIT HERE — your details. Projects are in PROJECTS below,
   posters for the hall are in POSTERS.
   ============================================================ */
const SITE = {
  name: "Trent Estes",
  location: "Blacksburg, VA",
  email: "trent.estes@yahoo.com",
  phone: "804-997-1613",
  linkedin: "https://www.linkedin.com/in/trent-estes-0a538b300/",
  instagram: "",
  resume: "resume.pdf",
  featured: ["gatorade-banana","ginergy","paige-bueckers-court","appalachian-folk-festival","hale-community-garden","the-junction"],
};
const CDN = "https://cdn.myportfolio.com/b4959d68-b493-4a74-8c26-0cfab32fedbd/";
const PROJECTS_ALL = /*__PROJECTS__*/[];
const POSTERS = /*__POSTERS__*/[];
const HALL_SLUG = "poster-library";
const HALL_SRC = PROJECTS_ALL.find(p=>p.slug===HALL_SLUG);
const PROJECTS = PROJECTS_ALL.filter(p=>p.slug!==HALL_SLUG);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad2 = n => String(n).padStart(2,"0");
const srcs = f => { const n=f.split("?")[0]; const web="images-web/"+n.replace(/\.png$/i,".jpg"); return [...new Set([web, "images-web/"+n, "images/"+n, ...(f.includes("?")?[CDN+f]:[])])]; };
function nextSrc(el){ const l=(el.dataset.fb||"").split("|").filter(Boolean); if(l.length){ el.dataset.fb=l.slice(1).join("|"); el.src=l[0]; } }
function img(f, alt, lazy=true, style=""){
  const [a,...rest]=srcs(f);
  return `<img src="${a}" data-fb="${rest.join("|")}" alt="${esc(alt)}" ${lazy?'loading="lazy"':''} decoding="async" draggable="false" ${style?`style="${style}"`:""} onerror="nextSrc(this)">`;
}
function setImg(el, f){ const [a,...rest]=srcs(f); el.dataset.fb=rest.join("|"); el.onerror=()=>nextSrc(el); el.src=a; }
const digits = s => s.replace(/[^0-9+]/g,"");
const by = slug => PROJECTS.find(p=>p.slug===slug);
const FEATURED = SITE.featured.map(by).filter(Boolean);
const ARCHIVE = PROJECTS.filter(p=>!FEATURED.includes(p));
const info = p => p.info || (p.rows.find(r=>r.p)||{}).p || "";
const ratio = ar => { const c=[[1,1],[4,5],[3,4],[2,3],[11,17]]; let b=c[0]; for(const r of c) if(Math.abs(r[0]/r[1]-ar)<Math.abs(b[0]/b[1]-ar)) b=r; return b.join(":"); };
function cover(p, lazy=true){
  const white = p.fit==="contain" ? " white" : "";
  return `<div class="pl-img${white}">${p.cover ? img(p.cover, p.title, lazy, p.pos?`object-position:${p.pos}`:"") : ""}</div>`;
}

/* ---------- home ---------- */
function home(){
  const plates = FEATURED.map((p,i)=>`
    <a class="plate" href="#${p.slug}">
      ${cover(p, i>2)}
      <div class="pl-num mono"><span>${pad2(i+1)} · ${esc(p.sub)}</span><span>${p.year}</span></div>
      <div class="pl-row"><h3 class="pl-t">${esc(p.title)}</h3><span class="ar" aria-hidden="true">→</span></div>
      <p class="pl-k">${esc(p.kind)}</p>
    </a>`).join("");
  const RN=Math.min(10,POSTERS.length);
  const ring = POSTERS.slice(0,RN).map((q,i)=>`<figure style="transform:translate(-50%,-50%) rotateY(${i*360/RN}deg) translateZ(var(--rr)) translateY(${(i-RN/2)*9}px)">${img(q.f,"",true)}</figure>`).join("");
  return `
  <section class="hero" id="top" aria-label="Introduction">
    <span class="g h" style="top:50%"></span>
    <span class="g v hide-m" style="left:clamp(16px,2.2vw,32px)"></span><span class="g v hide-m" style="right:clamp(16px,2.2vw,32px)"></span>
    <div class="h-top pad mono"><span>Brand + packaging designer</span><span>Blacksburg, VA</span></div>
    <h1 class="h-word a">Trent</h1>
    <div class="h-frame">
      <span class="lbl mono">3:2</span><span class="lbl r mono">TE</span>
      <picture><source srcset="images-web/te-sticker-halftone.png" media="(prefers-reduced-motion: reduce)"><img class="h-me" src="images-web/te-sticker-halftone.webp" alt="TE monogram sticker" decoding="async" fetchpriority="high" onerror="this.onerror=null;this.src='images-web/te-sticker-halftone.png'"></picture>
    </div>
    <p class="h-word b" aria-hidden="true">Estes</p>
    <div class="h-bot pad">
      <p>Hi, I'm Trent. I design brands and packaging, usually pulling from old music, the outdoors and anything retro.</p>
      <div class="h-btns"><a class="btn ink" href="#work">See the work <span class="ar">↓</span></a><a class="btn line" href="#posters">Poster hall <span class="ar">→</span></a></div>
    </div>
  </section>
  <div class="m-intro pad">
    <p>Hi, I'm Trent. I design brands and packaging, usually pulling from old music, the outdoors and anything retro.</p>
    <div class="h-btns"><a class="btn ink" href="#work">See the work <span class="ar">↓</span></a><a class="btn line" href="#posters">Poster hall <span class="ar">→</span></a></div>
  </div>

  <div class="pad">
    <section id="work">
      <div class="sh"><h2>Selected work</h2><span class="mono">${FEATURED.length} projects, ${Math.min(...FEATURED.map(p=>p.year))}–${Math.max(...FEATURED.map(p=>p.year))}</span></div>
      <div class="plates">${plates}</div>

  </div>

  <a class="hentry" href="#posters" aria-label="Enter the poster hall">
    <div class="he-in pad">
      <div class="he-text">
        <span class="mono">${POSTERS.length} posters</span>
        <h2>Poster hall</h2>
        <p>The posters, set on a spiral you can turn. Drag or scroll to move through it.</p>
        <span class="btn ink">Enter <span class="ar">→</span></span>
      </div>
      <div class="he-stage" aria-hidden="true"><div class="ring"><div class="sp">${ring}</div></div></div>
    </div>
  </a>

  <div class="pad">
    <section id="archive">
      <div class="sh"><h2>More work</h2><span class="mono">${ARCHIVE.length} projects</span></div>
      <table class="tbl">
        <thead><tr class="mono"><th class="y">Year</th><th>Project</th><th class="hide">Type</th><th class="go"></th></tr></thead>
        <tbody>${ARCHIVE.map(p=>`<tr data-slug="${p.slug}" data-cover="${p.cover||""}"><td class="y mono">${p.year}</td><td class="t"><a href="#${p.slug}">${esc(p.title)}</a></td><td class="hide mono muted">${esc(p.sub)}</td><td class="go">→</td></tr>`).join("")}</tbody>
      </table>
    </section>

    <section id="about">
      <div class="sh"><h2>About</h2><span class="mono">Blacksburg, Virginia · Virginia Tech</span></div>
      <div class="about">
        <figure class="a-photo">
          <img src="images-web/trent-portrait.jpg" alt="Trent Estes" width="1400" height="2100" loading="lazy">
          <figcaption class="mono"><span>Trent Estes</span><span>4:5</span></figcaption>
        </figure>
        <div class="a-body">
          <p>I'm a graphic and packaging designer with a bold eye and a love of the analog and natural world. Vintage design, a deep respect for the environment and a lifelong connection to music shape most of what I make.</p>
          <p>I treat every project as a problem worth solving, and I care about the details that make something stick. Passionate about everything, always willing to learn.</p>
          <div class="a-tags mono"><span>Vintage design</span><span>The outdoors</span><span>Music</span></div>
        </div>
      </div>
    </section>
  </div>
  ${footer()}`;
}
function footer(){
  return `
  <footer class="foot" id="contact">
    <div class="f-in pad">
      <h2>Want to work together? <span>Send me a note.</span></h2>
      <ul class="mono">
        <li><a href="mailto:${esc(SITE.email)}"><span>Email</span><span>${esc(SITE.email)}</span></a></li>
        <li><a href="tel:${digits(SITE.phone)}"><span>Phone</span><span>${esc(SITE.phone)}</span></a></li>
        ${SITE.linkedin?`<li><a href="${esc(SITE.linkedin)}" target="_blank" rel="noopener"><span>LinkedIn</span><span>↗</span></a></li>`:""}
        ${SITE.instagram?`<li><a href="${esc(SITE.instagram)}" target="_blank" rel="noopener"><span>Instagram</span><span>↗</span></a></li>`:""}
        ${SITE.resume?`<li><a href="${esc(SITE.resume)}"><span>Résumé</span><span>↗</span></a></li>`:""}
      </ul>
    </div>
    <div class="legal pad mono"><span>© ${new Date().getFullYear()} ${esc(SITE.name)}</span><span>Brand &amp; packaging design</span></div>
  </footer>`;
}

/* ---------- project page ---------- */
function project(p){
  const i=PROJECTS.indexOf(p), next=PROJECTS[(i+1)%PROJECTS.length];
  const text=info(p); let first=true, hn=0;
  const rows=p.rows.map(r=>{
    if(Array.isArray(r)) return `<div class="p-row c${r.length}">${r.map(f=>{const h=`<figure>${img(f,p.title,!first)}</figure>`; first=false; return h;}).join("")}</div>`;
    if(r.h) return `<h2 class="p-h"><span class="mono">${pad2(++hn)}</span><b>${esc(r.h)}</b></h2>`;
    if(r.p) return r.p===text ? "" : `<p class="p-text">${esc(r.p)}</p>`;
    if(r.cap) return `<p class="p-cap mono">${esc(r.cap)}</p>`;
    if(r.facts) return `<dl class="p-facts">${r.facts.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
    if(r.list) return `<ul class="p-list">${r.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    if(r.v) return `<a class="vid" href="https://www-ccv.adobe.io/v1/player/ccv/${r.v}/embed?api_key=BehancePro2View" target="_blank" rel="noopener"><span>Motion piece</span><span>Watch ↗</span></a>`;
    return "";
  }).join("");
  return `
  <div class="pad">
    <section class="p-head">
      <a class="back mono" href="#work">← Back to work</a>
      <h1>${esc(p.title)}</h1>
      <div class="p-sub">
        ${text?`<p class="p-info">${esc(text)}</p>`:"<span></span>"}
        <dl class="p-meta mono"><div><dt>Year</dt><dd>${p.year}</dd></div><div><dt>Type</dt><dd>${esc(p.sub)}</dd></div><div><dt>Discipline</dt><dd>${esc(p.tags.join(", "))}</dd></div></dl>
      </div>
    </section>
    <section class="p-body">${rows || (p.cover?`<div class="p-row c1"><figure>${img(p.cover,p.title,false)}</figure></div>`:"")}</section>
    <a class="nextp" href="#${next.slug}">
      <div><span class="mono">Next project →</span><span class="t">${esc(next.title)}</span></div>
      ${cover(next)}
    </a>
  </div>
  ${footer()}`;
}

/* ---------- the poster hall: posters on a turning spiral ---------- */
function hallHTML(){
  const vids=(HALL_SRC?HALL_SRC.rows.filter(r=>r.v):[]);
  const touch=matchMedia("(hover:none)").matches;
  return `
  <div class="hall" id="hall" tabindex="-1" role="region" aria-label="Poster hall: posters arranged on a spiral">
    <span class="g h" style="top:42%"></span><span class="g v" style="left:50%"></span>
    <div class="stage"><div class="cam" id="cam"><div class="helix" id="helix">
      <div class="floor" id="floor"></div>
      ${POSTERS.map((q,i)=>`<div class="hc" data-i="${i}" tabindex="0" role="button" aria-label="${esc(q.t)}">
        <div class="fa">${img(q.f,q.t,false)}<i></i></div>
        <div class="bk mono">${pad2(i+1)}</div>
        <div class="t1"><span>${ratio(q.ar)}</span></div>
        <div class="t2"><span>${pad2(i+1)}</span><b>${esc(q.t)}</b></div>
      </div>`).join("")}
    </div></div></div>
    <header class="hud">
      <a class="back mono" href="#work">← Back</a>
      <h1>Poster hall</h1>
      <span class="cnt mono" id="hcount">01 / ${pad2(POSTERS.length)}</span>
    </header>
    <div class="now" aria-live="polite"><span class="mono" id="nowN"></span><b id="nowT"></b><span class="mono" id="nowS"></span></div>
    <div class="hnav"><button type="button" id="hprev" aria-label="Previous poster">←</button><button type="button" id="hnext" aria-label="Next poster">→</button></div>
    <div class="hint mono" id="hint">${touch?"Swipe to turn the spiral · tap a poster to open it":"Drag or scroll to turn the spiral · click a poster to open it"}${vids.length?`<br>Motion pieces: ${vids.map((v,k)=>`<a style="pointer-events:auto" href="https://www-ccv.adobe.io/v1/player/ccv/${v.v}/embed?api_key=BehancePro2View" target="_blank" rel="noopener">${k+1} ↗</a>`).join(" ")}`:""}</div>
    <div class="lb" id="lb" hidden></div>
  </div>`;
}

const H = { raf:0, on:false };
function startHall(){
  const hall=$("#hall"), cam=$("#cam"), helix=$("#helix"), cards=[...hall.querySelectorAll(".hc")], N=cards.length;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PER=7, STEP=360/PER;
  let G={};
  function layout(){
    const w=innerWidth, h=innerHeight, mob=w<700;
    const PH=Math.round(mob?Math.min(150,h*.19):Math.min(230,h*.26));
    const avgW=PH*POSTERS.reduce((a,q)=>a+q.ar,0)/N;
    G={PH, DY:PH*.2, R:Math.max(PER*avgW*1.32/(2*Math.PI), mob?w*.36:0)};
    cards.forEach((c,i)=>{
      const pw=Math.round(PH*POSTERS[i].ar);
      Object.assign(c.style,{width:pw+"px",height:PH+"px",marginLeft:(-pw/2)+"px",marginTop:(-PH/2)+"px"});
      c._a=i*STEP; c._y=i*G.DY; c._b=Math.random()*6.28;
    });
    $("#floor").style.transform=`translate3d(0,${(N-1)*G.DY+PH/2+70}px,0) rotateX(90deg)`;
  }
  layout();
  const S={s:-.6, ts:0, tilt:-15, ttilt:-15, yaw:0, tyaw:0};
  let last=performance.now(), idleAt=performance.now()+2600, dir=1;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let hinted=false; const hint=()=>{ if(!hinted){ hinted=true; $("#hint").classList.add("gone"); } };
  let snapT=0; function move(d){ S.ts=clamp(S.ts+d,0,N-1); idleAt=performance.now()+4000; hint(); clearTimeout(snapT); snapT=setTimeout(()=>{ if(!drag) S.ts=Math.round(S.ts); },220); }
  function goTo(i){ S.ts=clamp(i,0,N-1); idleAt=performance.now()+5000; hint(); }
  let shown=-1;
  function frame(now){
    const dt=Math.min(50,now-last); last=now;
    if(now>idleAt && $("#lb").hidden){ S.ts+=dir*dt*.00012; if(S.ts>N-1){S.ts=N-1;dir=-1;} if(S.ts<0){S.ts=0;dir=1;} }
    const k=reduce?1:1-Math.pow(1-.075,dt/16.7);
    S.s+=(S.ts-S.s)*k; S.tilt+=(S.ttilt-S.tilt)*.05; S.yaw+=(S.tyaw-S.yaw)*.05;
    const rot=-S.s*STEP, y=S.s*G.DY;
    cam.style.transform=`translateZ(${-G.R*1.25}px) rotateX(${S.tilt}deg) rotateY(${S.yaw}deg)`;
    helix.style.transform=`translateY(${-y}px) rotateY(${rot}deg)`;
    const t=now/1000;
    cards.forEach((c,i)=>{
      const a=(c._a+rot)*Math.PI/180, f=Math.cos(a);
      const dv=Math.abs(c._y-y)/G.PH;
      const bob=reduce?0:Math.sin(t*.9+c._b)*4;
      c.style.transform=`translateY(${c._y+bob}px) rotateY(${c._a}deg) translateZ(${G.R}px)`;
      c.style.opacity=(dv>2.6?Math.max(0,1-(dv-2.6)/1.2):1).toFixed(3);
      c.firstElementChild.lastElementChild.style.opacity=((1-f)*.32).toFixed(3);
    });
    const cur=Math.round(clamp(S.s,0,N-1));
    if(cur!==shown){ shown=cur; const q=POSTERS[cur];
      cards.forEach((c,i)=>c.classList.toggle("cur",i===cur));
      $("#hcount").textContent=`${pad2(cur+1)} / ${pad2(N)}`; $("#nowN").textContent=`${pad2(cur+1)} · ${ratio(q.ar)}`; $("#nowT").textContent=q.t; $("#nowS").textContent=q.n; }
    if(H.on) H.raf=requestAnimationFrame(frame);
  }
  hall.addEventListener("wheel",e=>{ if(!$("#lb").hidden) return; e.preventDefault(); move((e.deltaY+e.deltaX)*(e.deltaMode===1?30:1)*.0028); },{passive:false});
  let drag=null, moved=false;
  hall.addEventListener("pointerdown",e=>{ if(e.target.closest("a,button,.lb")) return; drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY}; moved=false; hall.classList.add("drag"); });
  addEventListener("pointermove",H.pm=e=>{
    if(e.pointerType==="mouse"){ S.ttilt=-15+(e.clientY/innerHeight-.5)*-10; S.tyaw=(e.clientX/innerWidth-.5)*10; }
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6) moved=true;
    if(moved) move((-dx*1.2-dy*1.2)/(G.PH*.75));
  });
  addEventListener("pointerup",H.pu=()=>{ if(drag&&moved) S.ts=Math.round(S.ts); drag=null; hall.classList.remove("drag"); });
  const pick=i=>{ if(i===Math.round(S.s) && Math.abs(S.s-i)<.25) openLB(i); else goTo(i); };
  hall.addEventListener("click",e=>{ if(moved){ moved=false; return; } const c=e.target.closest(".hc"); if(c) pick(+c.dataset.i); });
  hall.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const c=e.target.closest&&e.target.closest(".hc"); if(c) pick(+c.dataset.i); } });
  addEventListener("keydown",H.kd=e=>{
    if(!$("#lb").hidden){ if(e.key==="Escape") closeLB(); return; }
    const cur=Math.round(S.ts);
    if(e.key==="ArrowRight"||e.key==="ArrowDown"){ e.preventDefault(); goTo(cur+1); }
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){ e.preventDefault(); goTo(cur-1); }
    else if(e.key==="Enter"&&!e.target.closest?.(".hc")){ openLB(cur); }
    else if(e.key==="Escape"){ location.hash="work"; }
  });
  $("#hprev").onclick=e=>{ e.stopPropagation(); goTo(Math.round(S.ts)-1); };
  $("#hnext").onclick=e=>{ e.stopPropagation(); goTo(Math.round(S.ts)+1); };
  addEventListener("resize",H.rs=()=>layout());
  function openLB(i){
    const q=POSTERS[i], lb=$("#lb");
    lb.innerHTML=`<button class="x mono" type="button" id="lbx">Close ×</button>${img(q.f,q.t,false)}<div class="meta"><span class="mono">${pad2(i+1)} of ${pad2(N)} · ${ratio(q.ar)}</span><b>${esc(q.t)}</b><span class="mono">${esc(q.n)}</span>${q.s&&PROJECTS.find(p=>p.slug===q.s)?`<a class="more mono" href="#${q.s}">See the project →</a>`:""}</div>`;
    lb.hidden=false; $("#lbx").onclick=closeLB; lb.onclick=e=>{ if(e.target===lb) closeLB(); };
  }
  function closeLB(){ $("#lb").hidden=true; idleAt=performance.now()+4000; }
  H.on=true; H.raf=requestAnimationFrame(frame);
}
function stopHall(){
  H.on=false; cancelAnimationFrame(H.raf);
  for(const [t,f] of [["pointermove",H.pm],["pointerup",H.pu],["keydown",H.kd],["resize",H.rs]]) if(f) removeEventListener(t,f);
  document.body.classList.remove("in-hall");
}

/* ---------- behaviour ---------- */
function bindHome(){
  const peek=$("#peek"), pim=peek.querySelector("img"), tb=document.querySelector(".tbl tbody");
  tb.addEventListener("mousemove", e=>{
    const tr=e.target.closest("tr"); if(!tr||!tr.dataset.cover){peek.classList.remove("on");return;}
    if(pim.dataset.f!==tr.dataset.cover){ pim.dataset.f=tr.dataset.cover; setImg(pim,tr.dataset.cover); }
    peek.style.left=e.clientX+"px"; peek.style.top=e.clientY+"px"; peek.classList.add("on");
  });
  tb.addEventListener("mouseleave", ()=>peek.classList.remove("on"));
  tb.addEventListener("click", e=>{ const tr=e.target.closest("tr"); if(tr && !e.target.closest("a")) location.hash=tr.dataset.slug; });
}
let mode=null;
function route(){
  let h=location.hash.slice(1);
  if(h===HALL_SLUG){ history.replaceState(null,"","#posters"); h="posters"; }
  const p=by(h);
  $("#peek").classList.remove("on");
  if(mode==="hall" && h!=="posters") stopHall();
  if(h==="posters"){
    if(mode!=="hall"){ $("#app").innerHTML=hallHTML(); mode="hall"; document.body.classList.add("in-hall"); startHall(); $("#hall").focus({preventScroll:true}); }
    document.title=`Poster hall · ${SITE.name}`;
  } else if(p){
    $("#app").innerHTML=project(p); mode="project"; cardVis();
    document.title=`${p.title} · ${SITE.name}`; window.scrollTo(0,0);
  } else {
    if(mode!=="home"){ $("#app").innerHTML=home(); bindHome(); mode="home"; }
    document.title=`${SITE.name} · Brand & packaging designer`;
    const el=h&&h!=="top"?document.getElementById(h):null;
    if(el) requestAnimationFrame(()=>el.scrollIntoView()); else window.scrollTo(0,0);
    requestAnimationFrame(cardVis);
  }
}
$("#fclose").addEventListener("click",()=>{ $("#fcard").hidden=true; try{sessionStorage.setItem("te-card","off")}catch(e){} });
try{ if(sessionStorage.getItem("te-card")==="off") $("#fcard").hidden=true; }catch(e){}
function cardVis(){ $("#fcard").classList.toggle("away", mode==="home" && scrollY < innerHeight*.7); }
addEventListener("scroll", cardVis, {passive:true});
addEventListener("hashchange", route);
addEventListener("keydown", e=>{
  if(mode!=="project") return;
  const i=PROJECTS.findIndex(x=>x.slug===location.hash.slice(1)); if(i<0) return;
  if(e.key==="ArrowRight") location.hash=PROJECTS[(i+1)%PROJECTS.length].slug;
  if(e.key==="ArrowLeft") location.hash=PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length].slug;
});
route(); cardVis();
</script>
