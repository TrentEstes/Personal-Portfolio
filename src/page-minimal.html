<title>Trent Estes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Trent Estes, graphic and packaging designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,500..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: the original Adobe Portfolio, cleaned up. Centered heavy wordmark, monospace voice, 3-up cover grid.
   New navigation: a "wall label" under the name that reads out whatever cover you point at, a full-screen index menu
   with live previews, and a tick rail on project pages. Deliberately single-theme: white, like the original. */
:root{
  --bg:#FFFFFF;
  --soft:#F3F3F1;
  --fg:#111111;
  --muted:#6E6E6A;
  --line:#E4E4E0;
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --maxw:1440px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.65 var(--mono);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.locked{overflow:hidden}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:800px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.sm{font:400 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.word{font-family:var(--sans);font-weight:900;font-stretch:100%;text-transform:uppercase;letter-spacing:-.005em}

/* ---------- header ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.bar .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:22px}
.bar .l{justify-self:start}.bar .r{justify-self:end}
.menu-btn{display:inline-flex;align-items:center;gap:10px}
.menu-btn i{display:grid;gap:4px;width:22px}
.menu-btn i::before,.menu-btn i::after{content:"";height:2px;background:var(--fg);transition:transform .25s}
.menu-btn:hover i::before{transform:translateX(4px)}
.wordmark{text-decoration:none;font-size:clamp(20px,2.4vw,28px);line-height:1;white-space:nowrap}
.bar .r a{text-decoration:none;border-bottom:1px solid transparent}
.bar .r a:hover{border-color:var(--fg)}
.bar.edge{box-shadow:0 1px 0 var(--line)}

/* ---------- wall label (home) ---------- */
.label-wall{text-align:center;padding-block:clamp(36px,6vw,80px) clamp(36px,5vw,64px)}
.lw-stage{position:relative;max-width:64ch;margin:0 auto;min-height:7.2em}
.lw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .3s ease,transform .3s ease}
.lw.off{opacity:0;transform:translateY(6px);pointer-events:none}
.lw-bio p{margin:0;font-size:clamp(15px,1.4vw,17px);line-height:1.7;color:var(--fg);text-wrap:balance}
.lw-bio .muted{color:var(--muted)}
.lw-proj .n{color:var(--muted)}
.lw-proj .t{font-size:clamp(28px,3.6vw,48px);line-height:1}
.lw-proj .d{color:var(--muted);text-wrap:balance}
@media (prefers-reduced-motion: reduce){.lw{transition:none}}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:clamp(28px,3vw,44px) clamp(10px,1.2vw,16px);padding-bottom:clamp(64px,8vw,120px)}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:12px;text-decoration:none}
.tile .img{aspect-ratio:3/4;max-width:100%;overflow:hidden;background:var(--soft)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .3s}
.grid:hover .tile img{opacity:.55}
.grid .tile:hover img,.grid .tile:focus-visible img{opacity:1;transform:scale(1.025)}
.tile .cap{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.tile .cap .n,.tile .cap .y{color:var(--muted)}
@media (hover:none){.grid:hover .tile img{opacity:1}}
@media (prefers-reduced-motion: reduce){.tile img{transition:none}}

/* ---------- contact ---------- */
.contact{border-top:1px solid var(--line);text-align:center}
.contact .wrap{padding-block:clamp(64px,9vw,128px);display:flex;flex-direction:column;align-items:center;gap:22px}
.contact h2{margin:0;font-size:clamp(40px,7vw,104px);line-height:.95}
.contact p{margin:0;max-width:52ch;color:var(--muted)}
.email{font:500 clamp(17px,2vw,24px)/1.3 var(--mono);text-decoration:none;border-bottom:1.5px solid var(--fg);word-break:break-all}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--fg);border-radius:999px;padding:9px 16px;text-decoration:none;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;transition:background .2s,color .2s}
.pill:hover,.pill.solid{background:var(--fg);color:var(--bg)}
.pill.solid:hover{background:var(--bg);color:var(--fg)}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding-block:20px 28px;border-top:1px solid var(--line);color:var(--muted)}

/* ---------- index menu ---------- */
.menu{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:in .25s ease}
@keyframes in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.menu{animation:none}}
.menu .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:22px}
.menu .top .r{justify-self:end}
.menu .body{display:grid;grid-template-columns:1fr;gap:28px 56px;padding-block:clamp(16px,3vw,40px) 48px}
@media (min-width:1000px){.menu .body{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.m-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.m-filters button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.m-filters button:hover{border-color:var(--fg);color:var(--fg)}
.m-filters button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.m-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.m-list a{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.m-list .n,.m-list .y{color:var(--muted);font-size:12.5px}
.m-list .t{font-size:clamp(26px,3.4vw,46px);line-height:1;transition:color .2s,transform .3s;transform-origin:left}
.m-list .d{grid-column:2/-1;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.m-list:hover .t{color:#bdbdb8}
.m-list a:hover .t,.m-list a:focus-visible .t,.m-list a[aria-current="page"] .t{color:var(--fg)}
.m-list a[aria-current="page"] .n::before{content:"● ";}
.m-prev{position:sticky;top:24px;display:none}
@media (min-width:1000px){.m-prev{display:block}}
.m-prev .img{aspect-ratio:3/4;max-height:calc(100vh - 180px);margin-left:auto;overflow:hidden;background:var(--soft)}
.m-prev img{width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.m-prev .k{display:block;margin-top:10px;text-align:right;color:var(--muted)}
.m-foot{display:flex;flex-wrap:wrap;gap:10px 22px;padding-block:20px;border-top:1px solid var(--line)}
.m-foot a{text-decoration:none}
.m-foot a:hover{text-decoration:underline}

/* ---------- project page ---------- */
.p-head{text-align:center}
.p-head .wrap{padding-block:clamp(36px,6vw,88px) clamp(28px,4vw,56px)}
.p-head .k{color:var(--muted)}
.p-head h1{margin:14px auto 0;max-width:18ch;font-size:clamp(38px,6.6vw,96px);line-height:.95;text-wrap:balance}
.p-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 24px;margin-top:22px;color:var(--muted)}
.p-meta span b{color:var(--fg);font-weight:500}
.p-body .wrap{display:flex;flex-direction:column;gap:clamp(8px,1.2vw,14px);padding-block:0 clamp(64px,8vw,112px)}
.p-row{display:grid;gap:clamp(8px,1.2vw,14px);grid-template-columns:1fr}
@media (min-width:720px){.p-row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.p-row.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.p-row figure{margin:0;background:var(--soft)}
.p-row img{width:100%;height:auto}
.p-text{margin:0 auto;max-width:56ch;text-align:center;padding-block:clamp(28px,5vw,72px);font-size:clamp(15px,1.4vw,17px);line-height:1.75;text-wrap:pretty}
.p-h{margin:0;text-align:center;padding-block:clamp(36px,5vw,72px) clamp(10px,1.4vw,18px);font-size:clamp(20px,2.2vw,28px);line-height:1}
.vid{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--fg);padding:18px 20px;text-decoration:none;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.vid:hover{background:var(--fg);color:var(--bg)}
.pn{border-top:1px solid var(--line)}
.pn .wrap{display:grid;grid-template-columns:1fr 1fr;padding-block:0}
.pn a{display:flex;flex-direction:column;gap:10px;text-decoration:none;padding-block:clamp(28px,4vw,56px) clamp(90px,9vw,110px);min-width:0}
.pn a+a{text-align:right;align-items:flex-end;border-left:1px solid var(--line);padding-left:16px}
.pn .k{color:var(--muted)}
.pn .t{font-size:clamp(22px,3.2vw,44px);line-height:1;transition:transform .3s}
.pn a:first-child:hover .t{transform:translateX(-6px)}
.pn a+a:hover .t{transform:translateX(6px)}

/* tick rail (desktop) */
.rail{position:fixed;right:max(8px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:15;display:none;flex-direction:column;align-items:flex-end;gap:10px}
@media (min-width:1100px){.rail{display:flex}}
.rail a{display:flex;align-items:center;gap:10px;text-decoration:none;height:14px}
.rail i{display:block;width:10px;height:2px;background:#c9c9c4;transition:width .25s,background .25s}
.rail span{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;opacity:0;transform:translateX(6px);transition:opacity .2s,transform .2s;background:var(--bg);padding:0 4px}
.rail a:hover i,.rail a:focus-visible i{width:18px;background:var(--fg)}
.rail a:hover span,.rail a:focus-visible span,.rail a[aria-current="page"] span{opacity:1;transform:none}
.rail a[aria-current="page"] i{width:24px;background:var(--fg)}

/* mobile switcher */
.switch{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;display:flex;align-items:center;background:var(--fg);color:var(--bg);border-radius:999px;padding:4px;box-shadow:0 10px 30px -12px rgba(0,0,0,.45);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.switch>*{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;text-decoration:none;color:inherit}
.switch>*:hover{background:#2a2a2a}
.switch .c{opacity:.6}
@media (min-width:1100px){.switch{display:none}}
</style>

<header class="bar" id="bar">
  <div class="wrap">
    <button class="menu-btn sm l" type="button" id="menu-open" aria-haspopup="dialog"><i aria-hidden="true"></i>Index</button>
    <a class="wordmark word" href="#top">Trent Estes</a>
    <span class="r sm"><a href="#contact">Contact</a></span>
  </div>
</header>

<main id="app"></main>

<footer class="foot">
  <div class="wrap sm">
    <span>© <span id="yr">2026</span> Trent Estes</span>
    <span>Graphic &amp; packaging design</span>
  </div>
</footer>

<script>
/* ============================================================
   EDIT HERE — your details. Project content is in PROJECTS below.
   Images load from ./images-web (web-sized) first, then ./images, then Adobe Portfolio.
   Double-click "Get images.command" once so the site keeps
   working after you cancel Adobe Portfolio.
   ============================================================ */
const SITE = {
  email: "you@yourdomain.com",           // ← your public email
  linkedin: "https://www.linkedin.com/", // ← your profile URL
  instagram: "",                         // optional
  resume: "resume.pdf",                  // drop resume.pdf next to index.html
};
const CDN = "https://cdn.myportfolio.com/b4959d68-b493-4a74-8c26-0cfab32fedbd/";

/* Each project: rows are image rows ([1–3 files]), {h:"Section heading"}, {p:"Paragraph"} or {v:"Adobe video id"}. */
const PROJECTS = /*__PROJECTS__*/[];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");

/* Image sources, tried in order: web-sized copy (images-web), full-size original (images), Adobe Portfolio. */
const srcs = f => { const n=f.split("?")[0]; const web="images-web/"+n.replace(/\.png$/i,".jpg"); return [...new Set([web, "images-web/"+n, "images/"+n, CDN+f])]; };
const local = f => srcs(f)[0];
function nextSrc(el){ const l=(el.dataset.fb||"").split("|").filter(Boolean); if(l.length){ el.dataset.fb=l.slice(1).join("|"); el.src=l[0]; } }
function img(f, alt, lazy=true){
  const [a,...rest]=srcs(f);
  return `<img src="${a}" data-fb="${rest.join("|")}" alt="${esc(alt)}" ${lazy?'loading="lazy"':''} decoding="async" onerror="nextSrc(this)">`;
}
function setImg(el, f){ const [a,...rest]=srcs(f); el.dataset.fb=rest.join("|"); el.onerror=()=>nextSrc(el); el.src=a; }
const num = p => pad(PROJECTS.indexOf(p)+1);
const N = () => pad(PROJECTS.length);

/* ---------- home ---------- */
function home(){
  return `
  <section class="label-wall" id="top"><div class="wrap">
    <div class="lw-stage">
      <div class="lw lw-bio" id="lw-bio">
        <p>Graphic and packaging designer with a bold eye and a love of the analog and natural world. Vintage design, the environment and music shape work that feels <span class="muted">considered, tactile and alive.</span></p>
      </div>
      <div class="lw lw-proj off" id="lw-proj" aria-hidden="true">
        <span class="n sm" id="lw-n"></span>
        <span class="t word" id="lw-t"></span>
        <span class="d" id="lw-d"></span>
      </div>
    </div>
  </div></section>

  <section id="work" aria-label="Work"><div class="wrap">
    <div class="grid" id="grid">${PROJECTS.map(p=>`
      <a class="tile" href="#${p.slug}" data-slug="${p.slug}">
        <div class="img">${img(p.cover, p.title)}</div>
        <div class="cap"><span class="n">${num(p)}</span><span>${esc(p.title)}</span><span class="y">${p.year}</span></div>
      </a>`).join("")}</div>
  </div></section>

  <section class="contact" id="contact"><div class="wrap">
    <span class="sm" style="color:var(--muted)">Contact</span>
    <h2 class="word">Say hello</h2>
    <p>Open to brand and packaging design roles, and happy to talk about print, type and identity work.</p>
    <a class="email" id="email" href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>
    <div class="links">
      <button class="pill solid" type="button" id="copy">Copy email</button>
      ${SITE.linkedin?`<a class="pill" href="${esc(SITE.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:""}
      ${SITE.instagram?`<a class="pill" href="${esc(SITE.instagram)}" target="_blank" rel="noopener">Instagram ↗</a>`:""}
      <a class="pill" href="${esc(SITE.resume)}">Résumé ↗</a>
    </div>
  </div></section>`;
}

/* ---------- project ---------- */
function project(p){
  const i = PROJECTS.indexOf(p), n = PROJECTS.length;
  const prev = PROJECTS[(i-1+n)%n], next = PROJECTS[(i+1)%n];
  let firstImg = true;
  const rows = p.rows.map(r=>{
    if(Array.isArray(r)) return `<div class="p-row c${r.length}">${r.map(f=>{const h=`<figure>${img(f, p.title, !firstImg)}</figure>`; firstImg=false; return h;}).join("")}</div>`;
    if(r.h) return `<h2 class="p-h word">${esc(r.h)}</h2>`;
    if(r.p) return `<p class="p-text">${esc(r.p)}</p>`;
    if(r.v) return `<a class="vid" href="https://www-ccv.adobe.io/v1/player/ccv/${r.v}/embed?api_key=BehancePro2View" target="_blank" rel="noopener"><span>Motion piece</span><span>Watch ↗</span></a>`;
    return "";
  }).join("");
  return `
  <section class="p-head"><div class="wrap">
    <span class="k sm">${num(p)} / ${N()}</span>
    <h1 class="word">${esc(p.title)}</h1>
    <div class="p-meta sm"><span><b>${esc(p.sub)}</b></span><span>${esc(p.tags.join(" · "))}</span><span>${p.year}</span></div>
  </div></section>
  <section class="p-body"><div class="wrap">${rows}</div></section>
  <nav class="pn" aria-label="Previous and next project"><div class="wrap">
    <a href="#${prev.slug}"><span class="k sm">← Previous</span><span class="t word">${esc(prev.title)}</span></a>
    <a href="#${next.slug}"><span class="k sm">Next →</span><span class="t word">${esc(next.title)}</span></a>
  </div></nav>
  <nav class="rail" aria-label="All projects">${PROJECTS.map(q=>`<a href="#${q.slug}" ${q===p?'aria-current="page"':''}><span>${num(q)} ${esc(q.title)}</span><i></i></a>`).join("")}</nav>
  <nav class="switch" aria-label="Project switcher">
    <a href="#${prev.slug}" aria-label="Previous project">←</a>
    <button type="button" data-open-menu><span class="c">${num(p)}/${N()}</span>Index</button>
    <a href="#${next.slug}" aria-label="Next project">→</a>
  </nav>`;
}

/* ---------- index menu ---------- */
function openMenu(){
  if($(".menu")) return;
  const current = PROJECTS.find(x=>x.slug===location.hash.slice(1));
  const tags = ["All", ...new Set(PROJECTS.flatMap(p=>p.tags))];
  const m = document.createElement("div");
  m.className="menu"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label","Project index");
  const startP = current || PROJECTS[0];
  m.innerHTML = `<div class="wrap">
    <div class="top"><span class="sm" style="color:var(--muted)">${N()} projects</span><a class="wordmark word" href="#top">Trent Estes</a><button class="sm r" type="button" id="menu-close">Close ✕</button></div>
    <div class="body">
      <div>
        <div class="m-filters" role="group" aria-label="Filter">${tags.map(t=>`<button type="button" data-tag="${t}" aria-pressed="${t==="All"}">${t}</button>`).join("")}</div>
        <ol class="m-list" id="m-list">${PROJECTS.map(p=>`<li data-tags="${p.tags.join(",")}"><a href="#${p.slug}" data-cover="${p.cover}" data-label="${num(p)} — ${esc(p.kind)}" ${p===current?'aria-current="page"':''}><span class="n">${num(p)}</span><span class="t word">${esc(p.title)}</span><span class="y">${p.year}</span><span class="d">${esc(p.sub)} · ${esc(p.tags.join(", "))}</span></a></li>`).join("")}</ol>
      </div>
      <div class="m-prev" aria-hidden="true"><div class="img">${img(startP.cover,"",false)}</div><span class="k sm" id="m-k">${num(startP)} — ${esc(startP.kind)}</span></div>
    </div>
    <div class="m-foot sm"><a href="#contact">Contact</a><a href="${esc(SITE.resume)}">Résumé ↗</a>${SITE.linkedin?`<a href="${esc(SITE.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:""}</div>
  </div>`;
  document.body.appendChild(m); document.body.classList.add("locked");
  const close = ()=>{ m.remove(); document.body.classList.remove("locked"); document.removeEventListener("keydown",onKey); };
  const onKey = e=>{ if(e.key==="Escape"){ close(); $("#menu-open").focus(); } };
  document.addEventListener("keydown", onKey);
  $("#menu-close").addEventListener("click", ()=>{ close(); $("#menu-open").focus(); });
  m.addEventListener("click", e=>{ if(e.target.closest("a")) close(); });
  const pv = m.querySelector(".m-prev img");
  const preview = a=>{ if(pv.dataset.f===a.dataset.cover) return; pv.dataset.f=a.dataset.cover; setImg(pv, a.dataset.cover); $("#m-k").textContent=a.dataset.label; };
  m.querySelector("#m-list").addEventListener("mouseover", e=>{ const a=e.target.closest("a"); if(a) preview(a); });
  m.querySelector("#m-list").addEventListener("focusin", e=>{ const a=e.target.closest("a"); if(a) preview(a); });
  m.querySelector(".m-filters").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return; const t=b.dataset.tag;
    m.querySelectorAll(".m-filters button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    m.querySelectorAll("#m-list li").forEach(li=>li.hidden = t!=="All" && !li.dataset.tags.split(",").includes(t));
  });
  $("#menu-close").focus();
}

/* ---------- home behaviour ---------- */
function bindHome(){
  const bio=$("#lw-bio"), pr=$("#lw-proj");
  let t=null;
  const show = p=>{ clearTimeout(t);
    $("#lw-n").textContent=`${num(p)} / ${N()} · ${p.year}`; $("#lw-t").textContent=p.title; $("#lw-d").textContent=p.kind;
    bio.classList.add("off"); pr.classList.remove("off"); };
  const reset = ()=>{ t=setTimeout(()=>{ pr.classList.add("off"); bio.classList.remove("off"); },180); };
  const grid=$("#grid");
  grid.addEventListener("mouseover", e=>{ const a=e.target.closest(".tile"); if(a) show(PROJECTS.find(p=>p.slug===a.dataset.slug)); });
  grid.addEventListener("mouseleave", reset);
  grid.addEventListener("focusin", e=>{ const a=e.target.closest(".tile"); if(a) show(PROJECTS.find(p=>p.slug===a.dataset.slug)); });
  grid.addEventListener("focusout", reset);

  const copy=$("#copy");
  copy.addEventListener("click", async()=>{
    try{ await navigator.clipboard.writeText(SITE.email); copy.textContent="Copied ✓"; }
    catch(e){ const r=document.createRange(); r.selectNodeContents($("#email")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent="Selected, press ⌘C"; }
    setTimeout(()=>copy.textContent="Copy email", 2200);
  });
}

/* ---------- routing ---------- */
const SECTIONS=["top","work","contact"];
let mode=null;
function route(){
  const h=location.hash.slice(1);
  const p=PROJECTS.find(x=>x.slug===h);
  if(p){
    $("#app").innerHTML=project(p); mode="project";
    document.title=`${p.title} · Trent Estes`;
    window.scrollTo(0,0);
  } else {
    if(mode!=="home"){ $("#app").innerHTML=home(); bindHome(); mode="home"; }
    document.title="Trent Estes";
    const el = SECTIONS.includes(h) ? document.getElementById(h) : null;
    if(el && h!=="top") requestAnimationFrame(()=>el.scrollIntoView()); else window.scrollTo(0,0);
  }
}
document.addEventListener("click", e=>{ if(e.target.closest("#menu-open,[data-open-menu]")) openMenu(); });
addEventListener("scroll", ()=>$("#bar").classList.toggle("edge", scrollY>8), {passive:true});
addEventListener("hashchange", route);
addEventListener("keydown", e=>{
  if(mode!=="project" || $(".menu")) return;
  const i=PROJECTS.findIndex(x=>x.slug===location.hash.slice(1)); if(i<0) return;
  if(e.key==="ArrowRight") location.hash=PROJECTS[(i+1)%PROJECTS.length].slug;
  if(e.key==="ArrowLeft") location.hash=PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length].slug;
});
$("#yr").textContent=new Date().getFullYear();
route();
</script>
